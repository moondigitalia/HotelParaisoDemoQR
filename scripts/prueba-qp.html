<!doctype html><meta charset="utf-8"><script src="/js/motor3d.js"></script>
<script>
(async()=>{const P=new URLSearchParams(location.search),out={},M=Motor3D;
const ld=s=>new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.src=s;});
for(const f of P.getAll('f')){const pz=await M.piezasIA(await ld('/scripts/.fuentes/raw/'+f));globalThis.__qp=null;const per=M.tienePersona(pz.playera);const q=per?M.quitarPersona(pz.playera):null;out[f]={per,q:!!q,qp:globalThis.__qp};}
window.R=out;document.title='listo';})().catch(e=>{window.R={error:String(e)};document.title='listo';});
</script>
