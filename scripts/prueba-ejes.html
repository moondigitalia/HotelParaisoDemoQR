<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{width:450px;height:675px;display:inline-block}</style>
<canvas id="a"></canvas><canvas id="b"></canvas>
<script src="/js/kit.js"></script><script src="/js/motor3d.js"></script>
<script>
(async()=>{
  const mk=(txt,col)=>{const c=document.createElement('canvas'); c.width=600;c.height=600; const g=c.getContext('2d'); g.fillStyle=col; g.fillRect(0,0,600,600); g.fillStyle='#000'; g.font='bold 90px sans-serif'; g.fillText(txt+' ARRIBA',20,120); g.fillStyle='#f00'; g.fillRect(0,0,120,40); return c;};
  for (const [id,vista] of [['a','frente'],['b','espalda']]) {
    const m=await Motor3D.crear(document.getElementById(id));
    await m.uniforme({frente:mk('F','#dde'), espalda:mk('E','#ede'), manga:'corta'});
    m.vista(vista,false);
  }
  setTimeout(()=>{document.title='listo';},600);
})();
</script>
