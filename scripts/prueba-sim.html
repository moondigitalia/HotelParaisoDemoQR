<!doctype html><meta charset="utf-8"><script src="/js/motor3d.js"></script>
<script>
(async()=>{const P=new URLSearchParams(location.search),out={},M=Motor3D;
const ld=s=>new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.src=s;});
for(const f of P.getAll('f')){const pz=await M.piezasIA(await ld('/scripts/.fuentes/raw/'+f));let c=pz.playera;const sep=M.separarConjunto(c,false);if(sep)c=sep.playera;const s=M.simetrizar(c);out[f]={a:c.toDataURL(),b:(s||c).toDataURL(),fa:+M.deFrente(c).toFixed(3),fb:+M.deFrente(s||c).toFixed(3),cambio:!!s};}
window.R=out;document.title='listo';})().catch(e=>{window.R={error:String(e)};document.title='listo';});
</script>
