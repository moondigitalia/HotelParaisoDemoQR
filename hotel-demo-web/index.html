<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Paraíso Cancún — Asistente Coral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B2E33;
    --teal:#12514D;
    --sand:#F3ECDA;
    --gold:#E8B34C;
    --seafoam:#8FBFAE;
    --ink:#0B2E33;
    --line: rgba(243,236,218,0.18);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--navy);color:var(--sand);font-family:'Karla',sans-serif;}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:
    radial-gradient(120% 60% at 50% -10%, rgba(232,179,76,0.14), transparent 60%),
    var(--navy);}

  /* HERO */
  .hero{padding:40px 20px 28px;text-align:center;border-bottom:1px solid var(--line);}
  .hero .eyebrow{font-size:13px;letter-spacing:.02em;color:var(--seafoam);margin-bottom:10px;}
  .hero h1{font-family:'Fraunces',serif;font-weight:500;font-size:30px;line-height:1.15;margin:0 0 8px;
    color:var(--sand);text-transform:uppercase;letter-spacing:.01em;}
  .hero p{font-size:14px;line-height:1.4;color:rgba(243,236,218,0.72);margin:0 auto;max-width:400px;
    white-space:nowrap;}

  .logo-coral{margin:14px auto 4px;width:44px;height:44px;}

  /* LEGAL NOTICE */
  .legal{margin:22px 20px 0;padding:14px 16px;background:rgba(15,61,54,0.55);border:1px solid var(--line);
    border-radius:10px;font-size:12px;line-height:1.55;color:rgba(243,236,218,0.75);}
  .legal-label{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--gold);margin-bottom:4px;}
  .legal-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* CHAT */
  .chat-shell{flex:1;display:flex;flex-direction:column;padding:18px 20px 16px;}
  .chat-header{display:flex;align-items:center;gap:10px;padding:8px 6px 14px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#c98f2e);
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;color:var(--navy);font-weight:600;}
  .chat-header .name{font-family:'Fraunces',serif;font-size:16px;color:var(--sand);}
  .chat-header .status{font-size:11.5px;color:var(--seafoam);}

  .messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px 14px;min-height:220px;}
  .msg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5;}
  .msg.bot{align-self:flex-start;background:var(--teal);color:var(--sand);border-bottom-left-radius:4px;}
  .msg.user{align-self:flex-end;background:var(--gold);color:var(--navy);border-bottom-right-radius:4px;font-weight:500;}
  .msg.typing{align-self:flex-start;background:var(--teal);padding:12px 16px;}
  .dot{display:inline-block;width:5px;height:5px;background:rgba(243,236,218,0.6);border-radius:50%;margin-right:4px;animation:blink 1.2s infinite;}
  .dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;margin-right:0;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  .suggestions{display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 12px;}
  .chip{font-size:12px;padding:7px 12px;border-radius:20px;border:1px solid var(--line);color:var(--sand);
    background:transparent;cursor:pointer;transition:.15s;}
  .chip:hover{border-color:var(--gold);color:var(--gold);}

  .input-row{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px;}
  .input-row input{flex:1;background:rgba(243,236,218,0.06);border:1px solid var(--line);border-radius:22px;
    padding:12px 16px;color:var(--sand);font-size:16px;font-family:'Karla',sans-serif;outline:none;}
  .input-row input::placeholder{color:rgba(243,236,218,0.4);}
  .input-row input:focus{border-color:var(--gold);}
  .send{width:42px;height:42px;border-radius:50%;border:none;background:var(--gold);color:var(--navy);
    font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .send:disabled{opacity:.5;cursor:default;}

  .footer{text-align:center;padding:14px 20px 22px;font-size:10.5px;color:rgba(243,236,218,0.35);}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="eyebrow">HOTEL PARAÍSO CANCÚN</div>
    <div class="logo-coral">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="22" cy="39" rx="9" ry="3" fill="#FFFFFF"/>
        <path d="M22 38L22 11" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M19.5 38L12 17" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
        <path d="M16.5 38L7 23" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M24.5 38L32 17" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
        <path d="M27.5 38L37 23" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Coral responde</h1>
    <p>Todo sobre tu estancia, al instante.</p>
  </div>

  <div class="legal">
    <div class="legal-label">AVISO</div>
    <div class="legal-text">Información de referencia, sujeta a cambios. Confirma con recepción.</div>
  </div>

  <div class="chat-shell">
    <div class="chat-header">
      <div class="avatar">
        <svg width="18" height="18" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="22" cy="39" rx="9" ry="3" fill="#FFFFFF"/>
          <path d="M22 38L22 11" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
          <path d="M18 38L10 18" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
          <path d="M26 38L34 18" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="name">Coral</div>
        <div class="status">● Asistente del hotel</div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="suggestions" id="suggestions">
      <button class="chip" data-q="¿A qué hora es el check-in y check-out?">Horarios de check-in</button>
      <button class="chip" data-q="What restaurants are near the hotel?">Ask in English</button>
      <button class="chip" data-q="¿Qué restaurantes hay cerca del hotel?">Qué hay cerca</button>
      <button class="chip" data-q="¿Cuál es el reglamento de la alberca?">Reglamento de alberca</button>
    </div>

    <div class="input-row">
      <input id="userInput" type="text" placeholder="Escribe tu pregunta...">
      <button class="send" id="sendBtn">➤</button>
    </div>
  </div>

  <div class="footer">Demo interno MOON Digital · Información actualizada: 1 sep 2026 · Datos ficticios</div>
</div>

<script>
// ---------- Lógica del chat ----------

const messagesEl = document.getElementById('messages');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const suggestions = document.getElementById('suggestions');
let history = [];
let greeted = false;

function scrollPageToBottom(){
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  });
}

function addMessage(text, sender){
  const el = document.createElement('div');
  el.className = 'msg ' + sender;
  el.textContent = text;
  messagesEl.appendChild(el);
  scrollPageToBottom();
  return el;
}

function showTyping(){
  const el = document.createElement('div');
  el.className = 'msg typing';
  el.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  messagesEl.appendChild(el);
  scrollPageToBottom();
  return el;
}

async function sendToAgent(userText){
  history.push({ role: "user", content: userText });
  const typingEl = showTyping();
  sendBtn.disabled = true;

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history })
    });
    const data = await response.json();

    typingEl.remove();
    if (data.error) {
      addMessage("Estamos experimentando alta demanda o un problema técnico. Intenta de nuevo en unos segundos 🙏", 'bot');
      history.pop();
    } else {
      addMessage(data.reply, 'bot');
      history.push({ role: "assistant", content: data.reply });
    }
  } catch (err) {
    typingEl.remove();
    addMessage("Hubo un problema de conexión. Intenta de nuevo.", 'bot');
    console.error(err);
    history.pop();
  }
  sendBtn.disabled = false;
}

function handleSend(){
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  input.value = '';
  suggestions.style.display = 'none';
  sendToAgent(text);
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });
suggestions.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    input.value = chip.dataset.q;
    handleSend();
  });
});

// Saludo inicial (se muestra en pantalla Y se registra en el historial que ve el modelo,
// para que nunca vuelva a presentarse en turnos posteriores). La API requiere que el
// historial empiece con un turno de "user", así que agregamos uno silencioso antes del saludo.
if (!greeted) {
  greeted = true;
  const saludo = "¡Hola! 🌴 Soy Coral, el asistente virtual del Hotel Paraíso Cancún. ¿En qué puedo ayudarte hoy?";
  addMessage(saludo, 'bot');
  history.push({ role: "user", content: "(El huésped acaba de escanear el código QR y abrir el chat)" });
  history.push({ role: "assistant", content: saludo });
}
</script>
</body>
</html>
